<div id="err">缺少金鑰</div><div id="app" style="display:none"></div>
<script>
/* ★資料不內嵌：改成載入時抓外部 d.txt 並帶 cache-bust（[[cache-bust-cdn-freeze]]）。
   原本把密文寫死在 HTML 裡 ⇒ 瀏覽器/CDN 快取住 HTML，主人手機就會看到【舊版】板子。
   拆開後：外殼可快取，資料每次都是最新。 */
let DATA="";
function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s),a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
(async function(){
  const k=location.hash.replace(/^#/,'');
  if(!k){return}
  try{
    DATA=(await (await fetch("d.txt?t="+Date.now(),{cache:"no-store"})).text()).trim();
    const raw=b64u(k), all=b64u(DATA);
    const key=await crypto.subtle.importKey('raw',raw,{name:'AES-CBC'},false,['decrypt']);
    const iv=all.slice(0,16), ct=all.slice(16);
    const pt=await crypto.subtle.decrypt({name:'AES-CBC',iv},key,ct);
    render(JSON.parse(new TextDecoder().decode(pt)));
  }catch(e){ document.getElementById('err').textContent='金鑰不正確'; }
})();
function render(d){
  document.getElementById('err').style.display='none';
  const app=document.getElementById('app'); app.style.display='block';
  /* ★★#698「已點過」的反灰要在【換波次時】自動恢復顏色（主人問：「html 的反灰會在什麼時基點恢復顏色？」）
     原本固定存 localStorage['bwdone'] 且**永遠不清**，看起來會自動重置只是因為下一波是新網址、
     剛好不在紀錄裡而已——**靠巧合不是靠機制**。萬一某張 lin.ee 跨波次重複出現，它一開始就是灰的
     ⇒ 主人以為點過而跳過＝漏點；而且那份紀錄每波累積 300+ 筆、永遠不會清。
     ⇒ 改成按波次分鍵 wdone.<waveKey>：波次一換自然是空的、舊波次的鍵順手刪掉。 */
  const DKEY='bwdone.'+(d.waveKey||'none');
  /* 一次性搬遷：把舊的 bwdone 併進「當前波次」（現在看的就是那一波，狀態不該平白消失），然後刪掉舊鍵 */
  try{
    const legacy=localStorage.getItem('bwdone');
    if(legacy && !localStorage.getItem(DKEY)){ localStorage.setItem(DKEY,legacy); }
    if(legacy){ localStorage.removeItem('bwdone'); }

           同一個根因、同一個修法：整組都是主人明講不要的 ⇒ 標籤與配色一律照「最後點」走。
           ★仍用 nb===0：混合組（BX-00 同時有蒼龍神劍與暴風天馬）維持原標籤，不可整組貶成最後點。 */
        const allBl = (g.nb===0);
        const cls = allBl ? 'lo' : (g.t.indexOf('高順位')>=0?'hi':(g.t==='黑名單'?'lo':'mid'));
        /* ★卡片標籤演進史（別憑印象改回去）：
             「黑名單」→ 主人 2026-08-16：「不要加黑名單三個字，最後點就最後點就好了」→ 改成「最後點」
             →「最後點」→ ★**主人 2026-08-26（#947c）：「不需要寫最後點，改 一般兩個字就好」** → 現在是「一般」。
           ⇒ 顏色（藍）與排序（沉到最底）已經把「最後才點」講清楚了，卡片標籤不需要再喊一次。
           ★圖例列的「🟦最後點」保留——那是【顏色說明】，拿掉的話藍色就沒人解釋了。
           判斷邏輯照舊用 g.t / allBl，這裡只改顯示文字。 */
        const tgTxt = (allBl || g.t==='黑名單') ? '一般' : g.t;
        /* ★★#967（主人 2026-08-27 問「zzxx 是什麼？」時一起看出來的顯示錯誤）：
           這個數字算的是【券數】，卻標成「家」。一般情況下每家店同型號只有 1 張 ⇒ 家＝張、看不出來；
           但 Funbox -中和環球店 是**同一家店 9 張**（他貼純連結、沒品名 ⇒ 全部歸到 ZZ-XX）
           ⇒ 板面寫「9 家」＝**錯的**，實際是 1 家 9 張。
           ⇒ 兩者不同時才顯示「N 家 / M 張」；相同時維持原樣（只增不減，其他卡片一個字都不變）。
           ★「依門市」分頁本來就是這樣寫的（縣市標題是「N 家 / M 張」）⇒ 這裡只是跟它對齊。 */
        const _st=[]; g.ls.forEach(function(x){ var k=x.s||x.sh; if(k&&_st.indexOf(k)<0)_st.push(k); });
        const _cnt=(_st.length===g.ls.length)?(g.ls.length+' 家'):(_st.length+' 家 / '+g.ls.length+' 張');
        /* ★#1141：拆組後的鍵是「型號 + 分隔 + 商品名」，標題要拆回來顯示，
           否則主人會看到一串帶控制字元的亂碼。 */
        const _kk = String(m).split('\u241F');
        /* ★#1150：標題不能直接用正規化後的中文（那會變成「蒼龍神劍」、看不出規格）
           ⇒ 挑這組裡**最長的那個原名**（通常就是最完整的寫法）。 */
        let mSub = (_kk.length>1 ? _kk[1] : '');
        if(_kk.length>1){ g.ls.forEach(function(x){ if(x.nm && String(x.nm).length>String(mSub).length) mSub=String(x.nm); }); }
        const mTitle = _kk[0];
        /* ★#1150b（截圖看到的）：商品名本身就帶型號 ⇒ 標題會變成「BX-00 BX-00 蒼龍神劍…」
           ⇒ 副標若以型號開頭（寬鬆比：不分大小寫、允許緊鄰空白）就把那段拿掉。 */
        try{ var _rx=new RegExp('^\s*'+mTitle.replace(/[-]/g,'\-')+'\s*','i'); mSub=String(mSub).replace(_rx,'').trim(); }catch(e){}
        h+='<div class="mg '+cls+'"><div class="mh">'+mTitle+(mSub?'<i class="pn">'+esc(mSub)+'</i>':'')+'<span class="tg">'+tgTxt+'</span><span class="n">'+_cnt+'</span></div><div class="ls">';
        /* ★熱力色也要套在這裡（#681）：原本只有「依門市」分頁給按鈕上 hi1/lo1，
           高順位／新增分頁一律綠 ⇒ 圖例寫「🔴＝高順位」卻整頁綠、自相矛盾。
           這裡按【群組型別】上色（同群同型別），與依門市分頁規則一致。 */
        g.ls.forEach(function(it){
          /* ★高順位分頁不上色（#682）：整頁都是高順位，再用警示色＝整片同色的噪音。
             其他分頁（新增）才需要色分。 */
          const lo = (view==='hi'||view==='wave') ? '' : ((it.t==='黑名單') ? ' lo1' : (it.h ? ' hi1' : ''));
          const wn2=(/-0+$/.test(it.m)&&it.nm)?'<i class="pn">'+esc(it.nm)+'</i>':'';   /* ★#942 同上 */
          const bl2=it.bl?' lo1':'';   /* ★#943 主人明講不要的 → 畫成最後點 */
          const pd2=(!slotOpen(it.ds)&&slotSoon(it.ds))?' pend':'';   /* ★#1013c 同 pd1：不再綁 multi */   /* ★#945 這張券還沒開抽 */
          h+='<a class="lk'+lo+(done[it.u]?' done':'')+(it.n?' new':'')+bl2+pd2+'" href="'+it.u+'" target="_blank" data-u="'+it.u+'" data-ds="'+esc(it.ds||'')+'" data-m="'+esc(it.m||'')+'">'+(it.sh||it.s)+wn2+(pd2?'<i class="pn">'+slotLabel(it.ds)+' 才開</i>':'')+'</a>';
        });
        h+='</div></div>';
      }
    });
    /* ★「新增」分頁自己說明基準（#688 主人問「從哪個進度開始才會生效？」）。
       ★#712 訂正：這段註解原本寫「基準＝上一次更新」——那是 #689 之前的舊行為，**跟下面真正輸出的文字相反**
       （真行為＝本波第一份名單之後、整波累計，見 L107-119 與 baseUrls）。註解留著舊值會誤導下一個接手的人。
       ★這頁存在的理由（主人 2026-08-17 說明，別再提議砍它）：**開打後才比較晚上架的門市**，
         它們新增的抽選商品就落在這一頁 ⇒ 主人開打後只要回來看這頁，就知道有哪些新的可以點。 */
    if(view==='new'){
      h+='<div class="sc" style="margin-bottom:10px">'
        +'＝<b>本波第一份名單（'+(d.prevAt?d.prevAt.slice(5,16):'—')+'）之後</b>才冒出來的券。<br>'
        +'整波<b>累計</b>，不會因為又抓了一次就被清掉——晚貼文的店、後來加的品項都會留在這裡。'
        +'</div>';
    }
    if(!keys.length)h+='<div class="sum">（這個分頁沒有項目）</div>';
    /* ★#942：前端原本【沒有任何 HTML 跳脫】。店名/型號碼不含特殊字元所以一直沒事，
       但商品品名會（CLAUDE.md 通知格式那條早就寫過「商品名可能含 &/<」）⇒ 補一個 esc()。 */
    app.innerHTML=h;
    drawTl();
    app.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){view=t.dataset.v;draw()}});
    /* ★#964 切換時段（不改分頁，只換看哪一場） */
    app.querySelectorAll('.sb').forEach(function(b){b.onclick=function(){curSlot=b.dataset.s;curModel=null;draw()}});
    app.querySelectorAll('.dpk').forEach(function(b){b.onclick=function(){curDate=b.dataset.d;curSlot=null;curModel=null;draw()}});
    var rz=document.getElementById('rz'); if(rz) rz.onclick=resetAll;   /* ★#942 手動歸零 */
    var chnb=document.getElementById('chn'); if(chnb) chnb.onclick=chainGo;   /* ★#1063 連抽 */
    /* ★#1068 型號篩選 */
    app.querySelectorAll('.mpk').forEach(function(b){b.onclick=function(){
      curModel = b.dataset.m || null; draw(); window.scrollTo(0,0);
    }});

    /* 區域快速鍵：捲到該縣市，並扣掉 sticky 列的高度免得標題被蓋住 */
    app.querySelectorAll('.jb').forEach(function(b){b.onclick=function(){
      var el=document.getElementById('cy'+b.dataset.i); if(!el)return;
      var off=(document.querySelector('.stick')||{offsetHeight:0}).offsetHeight+8;
      window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-off,behavior:'smooth'});
    }});
    /* ★#942：改記【時間戳】而不是 1 —— 才分得出「開抽前手滑按的」與「開抽後真的抽了的」 */
    app.querySelectorAll('a.lk').forEach(function(a){a.onclick=function(ev){
      /* ★#945 還沒開抽的券：擋住——別讓它變成「已點過」而在真的開抽時消失 */
      /* ★#964：守門改看 data-ds，不依賴 pend 樣式 ⇒ 就算沒畫暗（開抽前 2 小時以外）也照樣擋住，
         避免提早點掉、到真的開抽時反而被『已點過』藏起來。 */
      if(a.dataset.ds && Date.now() < new Date(a.dataset.ds).getTime()){ ev.preventDefault(); alert('這張券要到 '+slotLabel(a.dataset.ds)+' 才開抽，現在點沒有用。時間到了重新整理這一頁就會亮起來。'); return false; }
      a.classList.add('done');done[a.dataset.u]=Date.now();localStorage.setItem(DKEY,JSON.stringify(done));updChain();   /* ★#1063 手動點也要更新連抽計數 */
    }});
    updChain();   /* ★#1063 每次重畫後更新連抽剩餘數 */

    /* ★★★#972（主人 2026-08-27：「11 點一到重新整理後就可以點嗎？」→「好啊做」）：
       **時段一到自動重畫**，主人不必手動下拉重整。
       病灶：反灰與擋點都是 render 當下用 Date.now() 算的 ⇒ 11:00 到了畫面還是舊的、按鈕還是灰的，
             主人若沒重整會以為還沒開（而那正是分秒必爭的一刻）。
       ★兩層保險（手機瀏覽器在背景會凍結 timer，單靠 setTimeout 不可靠）：
         ①精準：對每個「還沒到」的時段掛一個 setTimeout，時刻一到（+1.5 秒緩衝）自動 draw()
         ②兜底：下面每 60 秒的 drawTl 會比對「開抽狀態有沒有變」，變了就 draw()
                （分頁從背景回到前景時，被凍結的 interval 會補跑 ⇒ 一回到畫面就自動更新）
       ★重畫前先清掉舊 timer，避免每次 draw() 都疊一層、愈積愈多。
       ★純前端、不影響任何資料；失敗最壞＝回到「手動重整」的舊行為。 */
    try{
      if(window.__slotTimers){ window.__slotTimers.forEach(function(x){ clearTimeout(x); }); }
      window.__slotTimers=[];
      slots.forEach(function(s){
        var ms=new Date(s).getTime()-Date.now();
        if(ms>0 && ms<24*3600*1000){ window.__slotTimers.push(setTimeout(function(){ draw(); }, ms+1500)); }
      });
      /* 給 ②兜底用的狀態指紋：哪些時段已經開了 */
      window.__slotsCache=slots;
      window.__slotSig=slots.map(function(s){ return slotOpen(s)?'1':'0'; }).join('');
    }catch(e){}
  }
  /* ★時間軸進度條（#684）：全部用「現在到開抽還有多久」講話，不用 T-24 黑話。
     每分鐘重畫一次，所以隔天早上打開看到的是當下狀態、不是發佈當下的快照。 */
  function fmtGap(ms){
    if(ms<0)ms=0;
    var mi=Math.floor(ms/60000), hh=Math.floor(mi/60), mm=mi%60;
    if(hh>=24){var dd=Math.floor(hh/24);return dd+' 天 '+(hh%24)+' 小時';}
    return hh>0 ? (hh+' 小時 '+mm+' 分') : (mm+' 分');
  }
  function drawTl(){
    var el=document.getElementById('tl'); if(!el)return;
    var sc=(d.scans||[]).filter(function(s){return s.iso}), now=new Date();
    var draw1=d.drawIso?new Date(d.drawIso):null;
    /* ★#691：沒有進行中的波次時，不可以整塊消失——那樣主人不知道「現在到底有沒有在打」。
       改成明講：活動期間（若有）＋「目前沒有進行中的波次」。 */
    if(!sc.length&&!draw1){
      var t='';
      if(d.waveEndIso){
        var f=function(x){return x.replace('T',' ').slice(5,16).replace('-','/');};
        t+='<div class="exp">活動 <b>'+(d.waveStart||'—')+'</b> ～ <b>'+f(d.waveEndIso)+'</b>　<b>已結束</b></div>';
      }
      t+='<div class="tlh"><span>😴 <b>目前沒有進行中的抽選波次</b></span></div>'
        +'<div class="tlf"><span class="g">下面是上一波的名單（僅供參考，點了沒用）</span></div>';
      el.innerHTML=t; el.style.display='';
      return;
    }
    var doneN=sc.filter(function(s){return new Date(s.iso)<=now}).length;
    var nx=sc.filter(function(s){return new Date(s.iso)>now})[0];
    /* ★#687：改 D 款（等距格子）後，就不需要「把時間換算成軸上位置」的比例計算了——
       格子本身就是刻度、下面直接寫開抽前幾小時。進度＝已跑過幾格。 */
    var s='';
    /* ★★券過期橫幅（#684）：清單是「上一次掃到的」，券過期它不會自己消失。
       不講的話主人早上會對著一整頁死連結猛點。這比任何配色都重要。 */
    /* ★#686（主人：「最上方那一段話太多廢話，其實就是活動幾月幾號到幾月幾號就好」）：
       只講活動期間；過期就多兩個字「已結束」並轉紅。其餘解釋一律砍掉。 */
    if(d.waveEndIso){
      var we=new Date(d.waveEndIso), over=we<now;
      var f=function(x){return x.replace('T',' ').slice(5,16).replace('-','/');};
      s+='<div class="exp'+(over?'':' ok')+'">活動 <b>'+(d.waveStart||'—')+'</b> ～ <b>'+f(d.waveEndIso)+'</b>'
        +(over?'　<b>已結束</b>':'')+'</div>';
    }
    /* ★簡易樣式（#685，主人：「時間軸有簡易樣式嗎？手機看這樣很累」）：壓成三行、字數砍半。
       第一行＝倒數（大字）＋右邊小字「下次幾點·已抓幾次」；第二行＝進度條；第三行＝起訖兩個時刻。 */
    s+='<div class="tlh"><span>';
    if(draw1&&draw1>now) s+='⏳ 開抽倒數 <b>'+fmtGap(draw1-now)+'</b>';
    else if(draw1) s+='🎯 <b>已開抽</b>';
    else s+='⏳ 進行中';
    /* ★#925：「下次抓」改用 d.nextScanAt（真正的下一次，含不佔格子的早期檢查點）。
       原本取 sc 階梯裡的下一格 ⇒ 早期檢查點隱形，會低估名單新鮮度。 */
    var nxTxt = d.nextScanAt ? d.nextScanAt.slice(6) : (nx?nx.at.slice(6):'');
    s+='</span><span class="g">'+(nxTxt?('下次抓 '+nxTxt+'　'):'')+doneN+'/'+sc.length+(d.earlyN?('+'+d.earlyN+'早'):'')+'</span></div>';
    /* D 款：8 個等距格子，下面標「開抽前幾小時」。走過的填深藍、下一個要跑的框紅邊。 */
    s+='<div class="dbar">';
    sc.forEach(function(x,i){
      var isDone=new Date(x.iso)<=now, isNow=(!isDone&&i===doneN);
      /* ★#992（債⑥）：原本一律用「小數一位的小時」⇒ T-0.75 顯示 0.8、T-0.25 顯示 0.3，
         主人看板子時要在腦中換算。改成：不到 1 小時就直接寫分鐘。 */
      var lead = null;
      if (draw1) {
        var __mins = Math.round((draw1 - new Date(x.iso)) / 60000);
        lead = (__mins < 60) ? (__mins + '分') : (Math.round(__mins / 6) / 10);
      }
      s+='<div class="dc'+(isDone?' dn':'')+(isNow?' now':'')+'" title="'+x.at+'">'
        +'<div class="db"></div><div class="dt">'+(lead!==null?lead:'')+'</div></div>';
    });
    s+='</div>';
    s+='<div class="tlf"><span class="g">數字＝開抽前多久（不到 1 小時顯示分鐘）</span>'
      +'<span>'+(d.draw?d.draw+' 開抽':'')+'</span></div>';
    el.innerHTML=s;
  }
  /* ★#972 兜底：每 60 秒檢查「開抽狀態有沒有變」，變了就整頁重畫。
     手機把分頁丟到背景時 setTimeout 會被凍結，回到前景時這個 interval 會補跑 ⇒ 一回畫面就自動亮起來。 */
  setInterval(function(){
    drawTl();
    try{
      var sig=(window.__slotsCache||[]).map(function(s){ return (Date.now()>=new Date(s).getTime())?'1':'0'; }).join('');
      if(window.__slotSig!==undefined && sig!==window.__slotSig){ draw(); }
    }catch(e){}
  },60000);
  resetPre();   /* ★#942 開頁時：若已過開抽時刻，把「開抽前手滑按的」清掉（每波只做一次）*/
  draw();
}
</script></body></html>
